name: Train Hero AI Model

on:
  workflow_dispatch:
    inputs:
      samples_per_class:
        description: Synthetic camera/TV variants per hero
        required: true
        default: "20"
      epochs:
        description: Training epochs
        required: true
        default: "8"
      scoreboard_samples_per_class:
        description: Domain-matched scoreboard crops per hero
        required: true
        default: "36"
      benchmark_scoreboards:
        description: Generated full scoreboards used for publish-gate testing
        required: true
        default: "600"

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install onnx requests pillow numpy

      - name: Train and export ONNX classifier
        run: |
          python training/train_hero_classifier.py \
            --samples-per-class "${{ inputs.samples_per_class }}" \
            --scoreboard-samples-per-class "${{ inputs.scoreboard_samples_per_class }}" \
            --epochs "${{ inputs.epochs }}" \
            --benchmark-scoreboards "${{ inputs.benchmark_scoreboards }}"

      - name: Validate ONNX file
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import onnx
          model = Path("app/src/main/assets/model/hero_classifier.onnx")
          onnx.checker.check_model(onnx.load(model))
          metrics = json.loads(Path("app/src/main/assets/model/model_metrics.json").read_text())
          print(metrics)
          assert model.stat().st_size > 1_000_000
          assert metrics["best_synthetic_validation_accuracy"] >= 0.72
          assert metrics["best_scoreboard_crop_validation_accuracy"] >= 0.72
          assert metrics["scoreboard_benchmark_scenes"] >= 500
          assert metrics["scoreboard_benchmark_accuracy"] >= 0.62
          PY

      - name: Commit trained model
        run: |
          git config user.name "HeroLens AI Trainer"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/assets/model/hero_classifier.onnx \
                  app/src/main/assets/model/hero_labels.txt \
                  app/src/main/assets/model/model_metrics.json
          if git diff --cached --quiet; then
            echo "No model changes to commit"
          else
            git commit -m "Train HeroLens neural hero classifier"
            git push
          fi

      - name: Upload model artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HeroLens-AI-model
          path: |
            app/src/main/assets/model/hero_classifier.onnx
            app/src/main/assets/model/hero_labels.txt
            app/src/main/assets/model/model_metrics.json
