name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew test lintDebug assembleDebug assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HeroLens-debug-apk
          path: app/build/outputs/apk/debug/*debug.apk
          if-no-files-found: error

      - name: Upload release packaging check
        uses: actions/upload-artifact@v4
        with:
          name: HeroLens-release-unsigned-apks
          path: app/build/outputs/apk/release/*release-unsigned.apk
          if-no-files-found: error
